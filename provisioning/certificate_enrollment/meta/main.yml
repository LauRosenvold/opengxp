---
galaxy_info:
  role_name: certificate_enrollment
  description: >-
    Requests (or revokes) a TLS certificate from an internal Windows CA
    (Active Directory Certificate Services) via certreq/certutil over
    WinRM. Private key and CSR are generated on the control node and
    never leave it. Lives in provisioning/, not roles/ — see
    docs/PKI_DNS.md.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Windows
      versions:
        - "2019"
        - "2022"
dependencies: []
