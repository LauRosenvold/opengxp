---
# Runs on the Hyper-V host itself, connected via WinRM (see
# playbooks/provision_vm_hyperv.yml and inventories/<env>/group_vars/
# hyperv_hosts.yml) — PowerShell does the actual work, Ansible just
# ships and runs the script and reports the result.

- name: Fail loudly if required Hyper-V placement details are missing
  ansible.builtin.assert:
    that:
      - vm_name != 'CHANGEME'
      - hyperv_template_export_path != 'CHANGEME'
      - hyperv_switch_name != 'CHANGEME'
    fail_msg: >-
      One or more required vm_name/hyperv_* vars are still at their
      CHANGEME placeholder — see
      provisioning/vm_provision/defaults/main.yml for the full list.
  when: vm_state == 'present'

- name: Fail loudly if vm_name is missing for a decommission
  ansible.builtin.assert:
    that:
      - vm_name != 'CHANGEME'
    fail_msg: "vm_name is still the CHANGEME placeholder."
  when: vm_state == 'absent'

- name: Render the provisioning PowerShell script onto the Hyper-V host
  ansible.windows.win_copy:
    content: "{{ lookup('template', 'hyperv_provision.ps1.j2') }}"
    dest: "C:\\Windows\\Temp\\vm_provision_{{ vm_name }}.ps1"

- name: Run the provisioning script
  ansible.windows.win_shell: "& 'C:\\Windows\\Temp\\vm_provision_{{ vm_name }}.ps1'"
  register: hyperv_provision_result
  changed_when: "'CHANGED' in hyperv_provision_result.stdout"

- name: Remove the temporary script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\vm_provision_{{ vm_name }}.ps1"
    state: absent

- name: Show the provisioning result
  ansible.builtin.debug:
    msg: "{{ hyperv_provision_result.stdout_lines }}"

- name: Get the new VM's reported IP address (best-effort — needs Hyper-V integration services + network up)
  ansible.windows.win_shell: >
    (Get-VMNetworkAdapter -VMName "{{ vm_name }}").IPAddresses | Select-Object -First 1
  register: hyperv_vm_ip
  changed_when: false
  failed_when: false
  when: vm_state == 'present'

- name: Ensure the provisioning output directory exists
  ansible.builtin.file:
    path: "{{ provisioning_output_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  when: vm_state == 'present'

- name: Write a reviewable inventory snippet (NOT the checked-in inventory itself)
  ansible.builtin.copy:
    dest: "{{ provisioning_output_dir }}/{{ vm_name }}.txt"
    content: |
      Generated by provisioning/vm_provision — review and fold the
      relevant details into inventories/<env>/hosts.yml and a new
      inventories/<env>/host_vars/{{ vm_name }}.yml yourself, as a normal
      reviewed change (see docs/CHANGE_CONTROL.md). This file is not
      consumed by anything automatically.

      vm_name:      {{ vm_name }}
      hypervisor:   hyperv ({{ inventory_hostname }}, switch {{ hyperv_switch_name }})
      reported IP:  {{ (hyperv_vm_ip.stdout | default('')) | trim or 'not yet reported — integration services may still be starting, check Hyper-V Manager directly' }}

      Reminder: Hyper-V has no native Linux guest customization — this
      VM booted with whatever the template defaults to (commonly DHCP).
      See docs/PROVISIONING.md.

      Next steps once this host is reachable over SSH:
        1. playbooks/provision_automation_user.yml
        2. playbooks/site.yml
        3. Whichever server_roles/apps playbooks this host actually needs
    mode: "0644"
  delegate_to: localhost
  when: vm_state == 'present'
