---
# Runs on the KVM/libvirt host itself, connected via normal SSH (see
# playbooks/provision_vm_kvm.yml and the kvm_hosts inventory group) — a
# rendered bash script does the actual work (virsh/qemu-img/virt-install),
# Ansible just ships, runs, and reports it. Same "no clean idempotent
# Ansible module exists for clone-from-template with guest
# customization" reasoning as the Hyper-V path (tasks/hyperv.yml) — this
# repo deliberately doesn't add a community.libvirt dependency here: that
# collection has no equivalent of vmware_guest/proxmox_kvm either (no
# single module clones-with-customization), so it would only replace
# virsh/qemu-img CLI calls with libvirt-python/lxml API calls of the same
# shape, while adding a Python-bindings dependency ON THE MANAGED HOST
# ITSELF (not just the control node, unlike pyvmomi/pywinrm/proxmoxer) —
# virsh/qemu-img/virt-install are the vendor's own documented tooling,
# already present on any real KVM hypervisor host.

- name: Fail loudly if required KVM placement details are missing
  ansible.builtin.assert:
    that:
      - vm_name != 'CHANGEME'
      - kvm_template_image_path != 'CHANGEME'
      - kvm_bridge != 'CHANGEME'
      - kvm_os_variant != 'CHANGEME'
    fail_msg: >-
      One or more required vm_name/kvm_* vars are still at their
      CHANGEME placeholder — see
      provisioning/vm_provision/defaults/main.yml for the full list.
  when: vm_state == 'present'

- name: Fail loudly if vm_name is missing for a decommission
  ansible.builtin.assert:
    that:
      - vm_name != 'CHANGEME'
    fail_msg: "vm_name is still the CHANGEME placeholder."
  when: vm_state == 'absent'

- name: Render the provisioning script onto the KVM host
  ansible.builtin.template:
    src: kvm_provision.sh.j2
    dest: "/tmp/vm_provision_{{ vm_name }}.sh"
    mode: "0700"

- name: Run the provisioning script
  ansible.builtin.command: "bash /tmp/vm_provision_{{ vm_name }}.sh"
  register: kvm_provision_result
  changed_when: "'CHANGED' in kvm_provision_result.stdout"

- name: Remove the temporary script
  ansible.builtin.file:
    path: "/tmp/vm_provision_{{ vm_name }}.sh"
    state: absent

- name: Show the provisioning result
  ansible.builtin.debug:
    msg: "{{ kvm_provision_result.stdout_lines }}"

- name: Get the new VM's reported IP address (best-effort — needs qemu-guest-agent running in the guest)
  ansible.builtin.shell: >
    set -o pipefail;
    virsh domifaddr {{ vm_name }} --source agent 2>/dev/null
    | awk '$3 == "ipv4" {print $4}' | cut -d/ -f1 | head -n1
  args:
    executable: /bin/bash
  register: kvm_vm_ip
  changed_when: false
  failed_when: false
  when: vm_state == 'present'

- name: Ensure the provisioning output directory exists
  ansible.builtin.file:
    path: "{{ provisioning_output_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  when: vm_state == 'present'

- name: Write a reviewable inventory snippet (NOT the checked-in inventory itself)
  ansible.builtin.copy:
    dest: "{{ provisioning_output_dir }}/{{ vm_name }}.txt"
    content: |
      Generated by provisioning/vm_provision — review and fold the
      relevant details into inventories/<env>/hosts.yml and a new
      inventories/<env>/host_vars/{{ vm_name }}.yml yourself, as a normal
      reviewed change (see docs/CHANGE_CONTROL.md). This file is not
      consumed by anything automatically.

      vm_name:      {{ vm_name }}
      hypervisor:   kvm ({{ inventory_hostname }}, bridge {{ kvm_bridge }})
      reported IP:  {{ (kvm_vm_ip.stdout | default('')) | trim or 'not yet reported — qemu-guest-agent may not be installed/running in the guest yet, check `virsh domifaddr ' + vm_name + '` directly' }}

      Suggested host_vars/{{ vm_name }}.yml starting point:
        ansible_host: "CHANGEME"

      Next steps once this host is reachable over SSH (see
      docs/PROVISIONING.md for the full lifecycle):
        1. playbooks/provision_automation_user.yml (creates the
           non-root automation account this repo requires)
        2. playbooks/site.yml (bootstrap + hardening + compliance evidence)
        3. Whichever server_roles/apps playbooks this host actually needs
    mode: "0644"
  delegate_to: localhost
  when: vm_state == 'present'
