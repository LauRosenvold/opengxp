---
# Runs on localhost (see playbooks/provision_vm_vcenter.yml) — vSphere
# API calls go straight from the control node to vcenter_hostname, no
# managed Linux host involved yet.

- name: Fail loudly if required vCenter connection/placement details are missing
  ansible.builtin.assert:
    that:
      - vcenter_hostname != 'CHANGEME'
      - vcenter_username != 'CHANGEME'
      - vcenter_password | length > 0
      - vcenter_datacenter != 'CHANGEME'
      - vcenter_cluster != 'CHANGEME'
      - vcenter_datastore != 'CHANGEME'
      - vm_name != 'CHANGEME'
    fail_msg: >-
      One or more required vcenter_*/vm_name vars are still at their
      CHANGEME placeholder — see
      provisioning/vm_provision/defaults/main.yml for the full list.

- name: Fail loudly if template/network aren't set (create only, not needed to decommission)
  ansible.builtin.assert:
    that:
      - vcenter_template_name != 'CHANGEME'
      - vcenter_network_portgroup != 'CHANGEME'
    fail_msg: >-
      vcenter_template_name / vcenter_network_portgroup are still at
      their CHANGEME placeholder.
  when: vm_state == 'present'

- name: Fail loudly if static networking is chosen without a complete address
  ansible.builtin.assert:
    that:
      - vcenter_network_ip | length > 0
      - vcenter_network_netmask | length > 0
      - vcenter_network_gateway | length > 0
    fail_msg: >-
      vcenter_network_type is 'static' but vcenter_network_ip/netmask/gateway
      aren't all set.
  when:
    - vm_state == 'present'
    - vcenter_network_type == 'static'

- name: Clone the VM from the vCenter template
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    resource_pool: "{{ vcenter_resource_pool if vcenter_resource_pool | length > 0 else omit }}"
    folder: "{{ vcenter_folder }}"
    name: "{{ vm_name }}"
    template: "{{ vcenter_template_name }}"
    datastore: "{{ vcenter_datastore }}"
    state: poweredon
    hardware:
      num_cpus: "{{ vm_cpu_count }}"
      memory_mb: "{{ vm_memory_mb }}"
    disk: "{{ [{'size_gb': vm_extra_disk_gb, 'type': 'thin', 'datastore': vcenter_datastore}] if vm_extra_disk_gb | int > 0 else omit }}"
    networks:
      - name: "{{ vcenter_network_portgroup }}"
        type: "{{ vcenter_network_type }}"
        ip: "{{ vcenter_network_ip if vcenter_network_type == 'static' else omit }}"
        netmask: "{{ vcenter_network_netmask if vcenter_network_type == 'static' else omit }}"
        gateway: "{{ vcenter_network_gateway if vcenter_network_type == 'static' else omit }}"
    customization:
      hostname: "{{ vcenter_customization_hostname }}"
      domain: "{{ vcenter_customization_domain if vcenter_customization_domain | length > 0 else omit }}"
      dns_servers: "{{ vcenter_dns_servers if vcenter_dns_servers | length > 0 else omit }}"
    wait_for_ip_address: "{{ vcenter_wait_for_ip_address }}"
    wait_for_ip_address_timeout: "{{ vcenter_wait_for_ip_timeout }}"
  delegate_to: localhost
  register: vcenter_vm_result
  when: vm_state == 'present'

- name: Delete the VM (decommission)
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    state: absent
    force: true
  delegate_to: localhost
  when: vm_state == 'absent'

- name: Report the created VM's reported IP address
  ansible.builtin.debug:
    msg: >-
      {{ vm_name }} created/running on vCenter {{ vcenter_hostname }}
      (cluster {{ vcenter_cluster }}). IP address:
      {{ vcenter_vm_result.instance.ipv4 | default('not yet reported — VMware Tools may still be starting, check vCenter directly') }}
  when: vm_state == 'present'

- name: Ensure the provisioning output directory exists
  ansible.builtin.file:
    path: "{{ provisioning_output_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  when: vm_state == 'present'

- name: Write a reviewable inventory snippet (NOT the checked-in inventory itself)
  ansible.builtin.copy:
    dest: "{{ provisioning_output_dir }}/{{ vm_name }}.txt"
    content: |
      Generated by provisioning/vm_provision — review and fold the
      relevant details into inventories/<env>/hosts.yml and a new
      inventories/<env>/host_vars/{{ vm_name }}.yml yourself, as a normal
      reviewed change (see docs/CHANGE_CONTROL.md). This file is not
      consumed by anything automatically.

      vm_name:      {{ vm_name }}
      hypervisor:   vcenter ({{ vcenter_hostname }}, cluster {{ vcenter_cluster }})
      reported IP:  {{ vcenter_vm_result.instance.ipv4 | default('not yet reported — check vCenter directly') }}

      Suggested host_vars/{{ vm_name }}.yml starting point:
        ansible_host: "{{ vcenter_vm_result.instance.ipv4 | default('CHANGEME') }}"

      Next steps once this host is reachable over SSH (see
      docs/PROVISIONING.md for the full lifecycle):
        1. playbooks/provision_automation_user.yml (creates the
           non-root automation account this repo requires)
        2. playbooks/site.yml (bootstrap + hardening + compliance evidence)
        3. Whichever server_roles/apps playbooks this host actually needs
    mode: "0644"
  delegate_to: localhost
  when: vm_state == 'present'
