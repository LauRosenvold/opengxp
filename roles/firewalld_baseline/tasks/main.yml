---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Get current default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: firewalld_current_zone
  changed_when: false

- name: Set default zone to default-deny
  ansible.builtin.command: "firewall-cmd --set-default-zone={{ firewalld_default_zone }}"
  when: firewalld_current_zone.stdout | trim != firewalld_default_zone
  changed_when: true

- name: Get current log-denied setting
  ansible.builtin.command: firewall-cmd --get-log-denied
  register: firewalld_current_log_denied
  changed_when: false

- name: Log denied packets for audit visibility
  ansible.builtin.command: "firewall-cmd --set-log-denied={{ firewalld_log_denied }}"
  when: firewalld_current_log_denied.stdout | trim != firewalld_log_denied

- name: Allow SSH on its configured port
  ansible.posix.firewalld:
    zone: "{{ firewalld_default_zone }}"
    port: "{{ firewalld_ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Apply fleet-wide base rules
  ansible.posix.firewalld:
    zone: "{{ firewalld_default_zone }}"
    service: "{{ item.service | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewalld_base_rules }}"
  loop_control:
    label: "{{ item.service | default(item.port) }}"

- name: Apply functional-group-specific rules
  ansible.posix.firewalld:
    zone: "{{ firewalld_default_zone }}"
    service: "{{ item.service | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewalld_rules }}"
  loop_control:
    label: "{{ item.service | default(item.port) }}"
