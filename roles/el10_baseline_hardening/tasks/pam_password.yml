---
# RHEL 9/10 manage /etc/pam.d/{system,password}-auth via authselect, which
# regenerates those files from a profile — hand-editing them directly gets
# silently reverted on the next `authselect apply-changes`. pwquality.conf
# and faillock.conf are read directly by their respective PAM modules and
# are NOT authselect-managed, so those are safe to edit with lineinfile.
# pwhistory's `remember=N` argument, however, lives in the PAM file itself,
# so it needs a custom authselect profile.

- name: Get current authselect profile
  ansible.builtin.command: authselect current --raw
  register: el10_baseline_authselect_current
  changed_when: false
  failed_when: false

- name: Determine base profile to build the custom profile from
  ansible.builtin.set_fact:
    el10_baseline_authselect_base: >-
      {{ (el10_baseline_authselect_current.stdout_lines[0] | default('sssd'))
         if el10_baseline_authselect_current.rc == 0 else 'sssd' }}

- name: Create custom authselect profile if one doesn't already exist
  ansible.builtin.command: >
    authselect create-profile gxp-hardened -b {{ el10_baseline_authselect_base }}
    --symlink-meta
  args:
    creates: /etc/authselect/custom/gxp-hardened

- name: Set pwhistory remember count in the custom profile's PAM templates
  ansible.builtin.lineinfile:
    path: "/etc/authselect/custom/gxp-hardened/{{ item }}"
    regexp: '^(password\s+\S+\s+pam_pwhistory\.so)(.*remember=\S+)?(.*)$'
    line: '\1 remember={{ el10_baseline_password_remember }}\3'
    backrefs: true
  loop:
    - system-auth
    - password-auth
  register: el10_baseline_pwhistory_edit
  failed_when: false   # line may not exist yet if pwhistory feature isn't enabled below; handled next

- name: Select the custom authselect profile with required features
  ansible.builtin.command: >
    authselect select custom/gxp-hardened with-faillock with-pwhistory --force
  register: el10_baseline_authselect_select
  changed_when: "'unchanged' not in el10_baseline_authselect_select.stdout | default('')"

- name: Re-apply pwhistory remember count now that the feature is enabled
  ansible.builtin.lineinfile:
    path: "/etc/authselect/custom/gxp-hardened/{{ item }}"
    regexp: '^(password\s+\S+\s+pam_pwhistory\.so)(.*remember=\S+)?(.*)$'
    line: '\1 remember={{ el10_baseline_password_remember }}\3'
    backrefs: true
  loop:
    - system-auth
    - password-auth

- name: Apply authselect changes
  ansible.builtin.command: authselect apply-changes
  changed_when: true

- name: Configure pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { key: minlen, value: "{{ el10_baseline_pwquality_minlen }}" }
    - { key: dcredit, value: "{{ el10_baseline_pwquality_dcredit }}" }
    - { key: ucredit, value: "{{ el10_baseline_pwquality_ucredit }}" }
    - { key: ocredit, value: "{{ el10_baseline_pwquality_ocredit }}" }
    - { key: lcredit, value: "{{ el10_baseline_pwquality_lcredit }}" }
    - { key: minclass, value: "{{ el10_baseline_pwquality_minclass }}" }
    - { key: maxrepeat, value: "{{ el10_baseline_pwquality_maxrepeat }}" }
    - { key: dictcheck, value: "{{ el10_baseline_pwquality_dictcheck }}" }
  loop_control:
    label: "{{ item.key }}"

- name: Enable enforce_for_root in pwquality.conf (standalone directive, not key=value)
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?\\s*enforce_for_root\\s*$"
    line: "enforce_for_root"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: el10_baseline_pwquality_enforce_for_root | bool

- name: Configure faillock.conf
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { key: deny, value: "{{ el10_baseline_faillock_deny }}" }
    - { key: unlock_time, value: "{{ el10_baseline_faillock_unlock_time }}" }
    - { key: fail_interval, value: "{{ el10_baseline_faillock_fail_interval }}" }
  loop_control:
    label: "{{ item.key }}"
