---
# Only ever invoked via playbooks/lvm_storage_grow.yml with --tags grow —
# same "explicit confirmation extra-var" gate as roles/fips_mode and
# server_roles/kubernetes_node's upgrade path, for the same reason: a
# disruptive-adjacent, change-controlled action that must never happen as
# a side effect of a routine run (even though growing, unlike shrinking,
# is one of LVM's genuinely safe operations — the gate is about
# deliberateness, not risk).

- name: Fail loudly unless the grow was explicitly confirmed
  ansible.builtin.assert:
    that:
      - lvm_storage_grow_confirmed | bool
      - lvm_storage_grow_lv_name is defined
      - lvm_storage_grow_size is defined
    fail_msg: >-
      Re-run with -e lvm_storage_grow_confirmed=true -e
      lvm_storage_grow_lv_name=<lv name> -e
      lvm_storage_grow_size=<e.g. +10G or 100%FREE> — see
      playbooks/lvm_storage_grow.yml.

- name: Extend the logical volume and grow its filesystem
  community.general.lvol:
    vg: "{{ lvm_storage_volume_group_name }}"
    lv: "{{ lvm_storage_grow_lv_name }}"
    size: "{{ lvm_storage_grow_size }}"
    resizefs: true
  register: lvm_storage_grow_result

- name: Report the result
  ansible.builtin.debug:
    msg: >-
      {{ lvm_storage_grow_lv_name }} in {{ lvm_storage_volume_group_name }}
      {{ 'grown' if lvm_storage_grow_result.changed else 'already at (or beyond) the requested size — nothing to do' }}.
