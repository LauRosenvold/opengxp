[defaults]
inventory            = inventories/production/hosts.yml
# Four tiers, each with different change-control weight and a different
# relationship to "a managed Linux host" (see docs/CHANGE_CONTROL.md,
# docs/SERVER_ROLES.md, docs/APPS.md, docs/PROVISIONING.md for why
# they're kept apart, even though all four are searched here for
# convenience so playbooks can reference a role by name regardless of
# tier):
#   provisioning/  creates the VM itself (vCenter/Hyper-V/Proxmox VE) — runs BEFORE any of the below apply
#   roles/         compliance/hardening baseline
#   server_roles/  workload-enablement platforms (docker_host, kubernetes_node, postgresql_server, ...)
#   apps/          specific applications deployed ON TOP of a server_role (netbox, ...)
roles_path           = roles:server_roles:apps:provisioning
collections_path     = collections
remote_tmp           = /tmp/.ansible-${USER}
local_tmp            = /tmp/.ansible-local-${USER}
retry_files_enabled  = False
host_key_checking    = True
interpreter_python   = auto_silent
forks                = 20
timeout              = 30
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 3600
stdout_callback      = yaml
callbacks_enabled    = timer, profile_tasks
log_path             = logs/ansible.log
nocows               = 1

# GxP note: log_path captures a run-level execution log. It is NOT the
# validated audit trail — that is the CI/CD pipeline log + git history of
# this repo + the target's own auditd/rsyslog records. See docs/VALIDATION.md.

[privilege_escalation]
become              = True
become_method       = sudo
become_ask_pass     = False

[ssh_connection]
pipelining          = True
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path_dir    = ~/.ansible/cp

[inventory]
enable_plugins      = host_list, script, auto, yaml, ini, toml
