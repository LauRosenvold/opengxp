---
# Creates (or decommissions) a VM from a vCenter template — see
# docs/PROVISIONING.md for the full lifecycle this fits into (provision
# -> playbooks/provision_automation_user.yml -> playbooks/site.yml ->
# whichever server_roles/apps playbooks the new host needs). Runs
# entirely from the Ansible control node against the vSphere API — no
# managed Linux host is involved, or even exists yet, at this point.
#
# Requires pyvmomi on the control node (pip install pyvmomi) — see
# requirements.yml's note on community.vmware.
#
# Usage:
#   ansible-playbook playbooks/provision_vm_vcenter.yml \
#     -i inventories/staging/hosts.yml \
#     -e vm_name=app06 \
#     -e vcenter_template_name=rhel9-golden-2026-01 \
#     -e vcenter_network_type=static \
#     -e vcenter_network_ip=10.20.10.55 \
#     -e vcenter_network_netmask=255.255.255.0 \
#     -e vcenter_network_gateway=10.20.10.1
#
# Decommission:
#   ansible-playbook playbooks/provision_vm_vcenter.yml \
#     -i inventories/staging/hosts.yml -e vm_name=app06 -e vm_state=absent

- name: Provision a VM from a vCenter template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    provisioning_hypervisor: vcenter

  roles:
    - role: vm_provision
      tags: [provision, vcenter]
