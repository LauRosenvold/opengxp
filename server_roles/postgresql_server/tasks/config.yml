---
- name: Ensure the conf.d directory exists
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Wire conf.d into postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgresql_data_dir }}/postgresql.conf"
    regexp: "^#?\\s*include_dir\\s*="
    line: "include_dir = 'conf.d'"
  notify: Restart postgresql

- name: Deploy the hardening configuration drop-in
  ansible.builtin.template:
    src: postgresql-hardening.conf.j2
    dest: "{{ postgresql_data_dir }}/conf.d/10-ansible-hardening.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.systemd:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
