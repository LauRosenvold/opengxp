---
# Turns a hardened RHEL9/RHEL10/AlmaLinux10 host into a PostgreSQL
# database server (PGDG packages, not the OS's built-in AppStream
# module). Runs against the `dbservers` inventory group. See
# docs/SERVER_ROLES.md for the operational caveats (backup is BYO beyond
# WAL archiving, replication is basic streaming with no automatic
# failover, pgAudit's log_parameter setting is a deliberate
# privacy/traceability trade-off, SSL defaults to self-signed).

# --- Version -----------------------------------------------------------------
# PGDG's repo RPM registers repos for every supported major version at
# once (pgdg13 .. pgdg17-ish depending on how current the repo RPM is);
# this picks which one actually gets used. Unlike server_roles/
# kubernetes_node's per-minor-version repos, switching this on an
# existing host does NOT upgrade in place — PostgreSQL major version
# upgrades need pg_upgrade or a dump/restore, deliberately not automated
# here (see docs/SERVER_ROLES.md).
postgresql_version: "16"

# --- Package source ------------------------------------------------------------
# Same Satellite-first posture as the other server_roles: sync PGDG into
# a Satellite custom product/content view for a real estate; the public
# URL is the fallback for lab/evaluation use.
postgresql_repo_baseurl: "CHANGEME"   # e.g. https://satellite.gxp.example.internal/pulp/repos/GxP-Enterprise/production/pgdg
postgresql_repo_gpgkey: "CHANGEME"    # e.g. https://satellite.gxp.example.internal/pub/RPM-GPG-KEY-PGDG
postgresql_public_repo_rpm_url: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"

# --- Paths / identity (PGDG's standard layout) ---------------------------------
postgresql_bin_dir: "/usr/pgsql-{{ postgresql_version }}/bin"
postgresql_data_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
postgresql_service_name: "postgresql-{{ postgresql_version }}"
postgresql_port: 5432

# Data directory sizing/placement (its own filesystem, sized for actual
# retention needs) is a provisioning-time decision this role can't make
# for you — same posture as roles/el10_baseline_hardening's /tmp mount
# note. Check `findmnt {{ postgresql_data_dir }}` yourself before relying
# on this for anything real.

# --- Replication ----------------------------------------------------------------
# "standalone" = no replication at all. "primary" and "replica" enable
# basic PostgreSQL streaming replication — no automatic failover, no
# Patroni/repmgr/pgpool, promotion is a manual, deliberate action (see
# docs/SERVER_ROLES.md). Set per-host in host_vars, not here — a flat
# dbservers group can contain several unrelated PostgreSQL instances, not
# necessarily all one replication set.
postgresql_role: standalone   # standalone | primary | replica
postgresql_primary_host: ""   # replica only: inventory_hostname of the primary to stream from

# Replication role credentials — vaulted, no default, so an
# enabled-but-uncredentialed replica setup fails loudly rather than
# silently using a guessable password.
postgresql_replication_user: replicator
postgresql_replication_password: ""

# --- Network / access control ---------------------------------------------------
postgresql_listen_addresses: "*"   # firewalld_baseline's default-deny zone is the actual perimeter control, not bind address
# CIDRs allowed to connect over the network, beyond localhost and (if
# replication is enabled) the primary/replica pair themselves. Fails
# loudly rather than silently allowing nothing or everything if you
# enable remote access without populating this.
postgresql_allowed_hosts: []
# Example: ["10.20.0.0/16"]   # CHANGEME

# --- TLS ------------------------------------------------------------------------
# Self-signed by default — fine for lab/staging, NOT approved for a real
# GxP production database. Point postgresql_ssl_cert_src/key_src at a
# real CA-issued cert/key (local paths on the control node, pushed via
# `copy`) once you have one; empty means generate self-signed here.
postgresql_ssl_enabled: true
postgresql_ssl_cert_src: ""
postgresql_ssl_key_src: ""
postgresql_ssl_self_signed_days: 825   # ~27 months; re-generate before this expires, this role does not track that for you

# --- pgAudit (GxP SQL-level audit trail) ----------------------------------------
# CIS-PostgreSQL-Benchmark-adjacent and specifically relevant for GxP:
# who changed what data/schema/permissions, when. Re-review the class
# list and log_parameter trade-off against your own risk assessment
# before relying on this verbatim, same caveat as every other hardening
# default list in this repo.
postgresql_pgaudit_enabled: true
postgresql_pgaudit_package: "pgaudit_{{ postgresql_version }}"   # verify this package name against your PGDG repo — pgaudit's RPM naming has varied
postgresql_pgaudit_log_classes: "ddl, write, role, misc"          # deliberately excludes "read" — full SELECT logging is usually too noisy to be useful; add it back if your risk assessment needs it
postgresql_pgaudit_log_catalog: false     # cut noise from routine catalog/system queries
postgresql_pgaudit_log_parameter: true    # log actual bound values, not just query shape — needed to reconstruct WHAT changed for a GxP record, at the cost of parameter values (potentially PII/sensitive) landing in the audit log
postgresql_pgaudit_log_relation: true
postgresql_pgaudit_log_statement_once: false

# --- Core logging (independent of pgAudit) --------------------------------------
postgresql_log_connections: true
postgresql_log_disconnections: true
postgresql_log_min_duration_statement_ms: 1000   # log slow queries; -1 to disable
postgresql_log_line_prefix: "%m [%p] %q%u@%d/%a "  # timestamp, pid, user, db, application_name — enough to correlate with roles/auditd_gxp's OS-level trail

# --- WAL archiving (backup building block, not a backup solution) --------------
# Off by default. Turning this on gives you the *mechanism* PostgreSQL
# needs for point-in-time recovery; it does NOT give you an actual backup
# target, retention policy, or restore tooling — that's bring-your-own
# (pgBackRest/Barman/whatever your org standardizes on), same posture as
# server_roles/kubernetes_node's HA-load-balancer gap. archive_command
# below just copies WAL segments to a local directory as a starting
# point; point it at your real archiving tool's command once you have one.
postgresql_wal_archiving_enabled: false
postgresql_wal_archive_dir: "/var/lib/pgsql/{{ postgresql_version }}/wal_archive"

# --- Connection/resource tuning (conservative, safe-default starting points —
# size these against actual hardware/workload, this is not a performance
# tuning role) ---
postgresql_max_connections: 200
postgresql_shared_buffers: "256MB"
postgresql_effective_cache_size: "1GB"
