---
- name: Create the etcd system group
  ansible.builtin.group:
    name: "{{ etcd_group }}"
    gid: "{{ etcd_uid }}"
    system: true
    state: present

- name: Create the etcd system user
  ansible.builtin.user:
    name: "{{ etcd_user }}"
    uid: "{{ etcd_uid }}"
    group: "{{ etcd_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ etcd_data_dir }}"
    create_home: false
    state: present

- name: Check whether etcd is already installed
  ansible.builtin.stat:
    path: "{{ etcd_install_dir }}/etcd"
  register: etcd_binary_stat

- name: Check the installed binary's version, if present
  ansible.builtin.command: "{{ etcd_install_dir }}/etcd --version"
  register: etcd_installed_version_check
  changed_when: false
  failed_when: false
  when: etcd_binary_stat.stat.exists

- name: Download and install the pinned etcd release
  when: >-
    not etcd_binary_stat.stat.exists
    or etcd_version not in (etcd_installed_version_check.stdout | default(''))
  block:
    - name: Download the etcd release tarball
      ansible.builtin.get_url:
        url: "{{ etcd_release_url }}"
        dest: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ etcd_release_sha256 }}"
        mode: "0644"

    - name: Extract the etcd/etcdctl/etcdutl binaries
      ansible.builtin.unarchive:
        src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/etcd"

    - name: Install the binaries
      ansible.builtin.copy:
        src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
        dest: "{{ etcd_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      loop:
        - etcd
        - etcdctl
        - etcdutl
      notify: Restart etcd

    - name: Clean up the downloaded tarball and extracted directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        - "/tmp/etcd-v{{ etcd_version }}-linux-amd64"

- name: Ensure the data directory exists
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0700"

- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ etcd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
