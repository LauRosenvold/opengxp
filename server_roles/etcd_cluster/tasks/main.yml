---
# Order matters, same principle as this repo's other server_roles:
# binaries/user before TLS material, TLS material before the config
# file that references it, config before the service starts, service
# running before any etcdctl-based task (auth).

- name: Fail loudly if the release checksum wasn't supplied
  ansible.builtin.assert:
    that:
      - etcd_release_sha256 | length > 0
    fail_msg: >-
      etcd_release_sha256 is empty. Get it from etcd's own SHA256SUMS
      file for v{{ etcd_version }}
      (https://github.com/etcd-io/etcd/releases/tag/v{{ etcd_version }})
      and set it alongside etcd_version — this role refuses to install
      an unverified binary.

- name: Fail loudly if the cluster token is still the CHANGEME placeholder
  ansible.builtin.assert:
    that:
      - etcd_cluster_token != 'CHANGEME'
    fail_msg: >-
      etcd_cluster_token is still the CHANGEME placeholder — set it to
      an arbitrary string unique to this cluster bootstrap, the same
      value on every host in etcd_hosts.

- name: Fail loudly if auth is enabled with no root password
  ansible.builtin.assert:
    that:
      - etcd_root_password | length > 0
    fail_msg: >-
      etcd_auth_enabled is true but etcd_root_password is empty. Supply
      it via an ansible-vault encrypted group_vars/host_vars file.
  when: etcd_auth_enabled | bool

- name: Install etcd
  ansible.builtin.include_tasks: install.yml
  tags: [prep]

- name: Configure TLS
  ansible.builtin.include_tasks: tls.yml
  tags: [prep]

- name: Deploy configuration and start etcd
  ansible.builtin.include_tasks: config.yml
  tags: [config]

- name: Configure root authentication
  ansible.builtin.include_tasks: auth.yml
  tags: [auth]
  when: etcd_auth_enabled | bool
