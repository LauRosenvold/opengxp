---
# Turns a hardened RHEL9/RHEL10/AlmaLinux10 host (from roles/, already
# applied via playbooks/site.yml) into a generic Docker workload host.
# See docs/SERVER_ROLES.md for why this lives in server_roles/ rather
# than roles/, and for the operational caveats called out below in more
# depth (DOCKER-USER/firewalld interaction, ip_forward, AIDE noise,
# docker-group-is-root-equivalent).

# --- Package source -----------------------------------------------------------
# In a real Satellite-managed estate, sync Docker CE into a custom
# product/content view and point this at that Satellite repo — don't add
# download.docker.com directly on a host whose patching is otherwise
# entirely Satellite-mediated (see roles/satellite_registration). The
# public URL below is what to use in a sandbox/lab environment before
# that content view exists, or in an environment that intentionally
# doesn't use Satellite for this OS group.
docker_repo_baseurl: "CHANGEME"   # e.g. https://satellite.gxp.example.internal/pulp/repos/GxP-Enterprise/production/docker-ce
docker_repo_gpgkey: "CHANGEME"    # e.g. https://satellite.gxp.example.internal/pub/RPM-GPG-KEY-docker

# Fallback used only when docker_repo_baseurl is left as CHANGEME — makes
# the role usable out of the box for evaluation/staging, but this is
# exactly the "bypasses Satellite" path called out above. Docker only
# tests/publishes against RHEL and CentOS paths; AlmaLinux uses the
# "centos" path too since there is no "almalinux" path upstream.
docker_public_repo_url_by_distro:
  RedHat: "https://download.docker.com/linux/rhel/docker-ce.repo"
  AlmaLinux: "https://download.docker.com/linux/centos/docker-ce.repo"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - container-selinux

# --- Daemon hardening (loosely CIS Docker Benchmark-aligned) ------------------
docker_daemon_selinux_enabled: true
docker_daemon_live_restore: true          # containers keep running across a dockerd restart/upgrade
docker_daemon_icc: false                  # disable inter-container comms on the DEFAULT bridge only;
                                           # user-defined networks (the recommended pattern) are unaffected
docker_daemon_userland_proxy: false
docker_daemon_no_new_privileges: true
docker_daemon_storage_driver: overlay2
docker_daemon_log_driver: journald         # keeps container logs on the same path roles/logging_forward already ships off-box
docker_daemon_default_ulimit_nofile_soft: 65536
docker_daemon_default_ulimit_nofile_hard: 65536
docker_daemon_userns_remap: ""             # e.g. "default" for user namespace remapping — off by default, opt in per-host if workloads support it

# Registries — empty/discouraged by default. If you run an internal
# registry (Nexus/Artifactory/Harbor, or apps/registry from this repo),
# prefer proper CA trust (docker_trusted_registry_cas below) over
# insecure-registries; only use insecure-registries in a lab.
docker_registry_mirrors: []
docker_insecure_registries: []

# CA certificates to trust for specific private registries, deployed to
# /etc/docker/certs.d/<registry>/ca.crt — the secure alternative to
# insecure-registries (which disables TLS verification entirely rather
# than trusting one specific, known CA). If the registry uses a
# self-signed cert (apps/registry's default), point ca_cert_src at that
# same cert — a self-signed leaf cert works fine here as its own "CA"
# for this purpose; only real CAs need a separate CA file. `registry`
# must include the port if the registry doesn't listen on the default
# HTTPS port (443) — e.g. "registry.gxp.example.internal" needs no port
# suffix at 443, "registry.gxp.example.internal:5000" would if it did.
docker_trusted_registry_cas: []
# Example:
#   - { registry: "registry.gxp.example.internal", ca_cert_src: "/path/on/control/node/registry.crt" }

# Requires a signing/notary setup on your registry side — off by default
# since most orgs don't have that yet. Strongly recommended to flip on
# for gxp_critical docker hosts pulling images that become part of a
# validated deployment.
docker_content_trust_enabled: false

# --- Networking / sysctl -------------------------------------------------------
# roles/el10_baseline_hardening (and ansible-lockdown.RHEL9-CIS on rhel9)
# disable IP forwarding fleet-wide by default — Docker cannot function
# without it. This role re-enables it explicitly rather than relying on
# inventories/<env>/group_vars/docker_hosts.yml alone, so a host is never
# silently half-configured if someone runs this role without also having
# applied that group_vars file.
docker_enable_ip_forward: true

# --- Optional DOCKER-USER inbound restriction ---------------------------------
# Docker inserts its own ACCEPT rules ahead of firewalld's zone rules for
# any published container port — firewalld_baseline's default-deny zone
# does NOT protect published container ports by itself (see
# docs/SERVER_ROLES.md). Off by default because turning it on with an
# empty allow-list would fail-closed and lock out everyone; the role
# asserts a non-empty list before enabling it.
docker_restrict_published_ports: false
docker_allowed_source_cidrs: []
# Example: ["10.20.0.0/16", "10.30.5.0/24"]

# --- Audit -----------------------------------------------------------------
# Own rules.d file, independent of roles/auditd_gxp's gxp.rules — see
# templates/docker.rules.j2. Same immutable-mode caveat applies: if
# roles/auditd_gxp already set -e 2 on a previous boot, these rules land
# on disk immediately but need a reboot to actually load.
docker_audit_rules_enabled: true

# --- AIDE -------------------------------------------------------------------
# /var/lib/docker churns constantly (image layers, container filesystems)
# — watching it would drown roles/aide_fim's checks in false positives.
# /etc/docker (daemon.json, TLS certs) is config and should be watched.
docker_aide_watch_enabled: true
