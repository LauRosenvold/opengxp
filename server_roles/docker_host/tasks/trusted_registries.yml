---
- name: Ensure a per-registry cert directory exists
  ansible.builtin.file:
    path: "/etc/docker/certs.d/{{ item.registry }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_trusted_registry_cas }}"
  loop_control:
    label: "{{ item.registry }}"

- name: Deploy the trusted CA certificate for each registry
  ansible.builtin.copy:
    src: "{{ item.ca_cert_src }}"
    dest: "/etc/docker/certs.d/{{ item.registry }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ docker_trusted_registry_cas }}"
  loop_control:
    label: "{{ item.registry }}"
  # No daemon restart needed — dockerd reads /etc/docker/certs.d/ per
  # pull/push, not at startup.
