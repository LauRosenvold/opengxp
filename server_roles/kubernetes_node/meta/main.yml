---
galaxy_info:
  role_name: kubernetes_node
  description: >-
    Vanilla kubeadm Kubernetes node setup (control-plane, worker, and
    optional dedicated etcd), supporting Kubernetes 1.28-1.34 via
    pkgs.k8s.io per-version repos and a kubeadm-config-API-version-aware
    template (v1beta3 below 1.31, v1beta4 from 1.31 on — mandatory from
    1.32), pluggable container runtime (containerd/CRI-O), pluggable CNI
    (Calico/Flannel), optional MetalLB (L2 mode), optional external
    (non-stacked) etcd cluster via the k8s_etcd inventory group,
    audit/encryption-at-rest, and a gated, one-minor-at-a-time upgrade
    path. Lives in server_roles/, not roles/ — see docs/SERVER_ROLES.md.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["9", "10"]
dependencies: []
