---
# Copies the external etcd CA and the shared apiserver-etcd-client
# cert/key (both generated once in tasks/etcd_local.yml, fetched to the
# control node, and pushed back out from there — see that file's
# comment on why cross-host distribution always goes through the
# control node rather than directly between managed hosts) onto every
# control-plane host, first or joining, before kubeadm ever runs there.
# Runs against the whole k8s_control_plane group; only included from
# tasks/main.yml when k8s_external_etcd_enabled is true.

- name: Check whether this control-plane host already has a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_external_etcd_certs_stat

- name: Ensure /etc/kubernetes/pki/etcd exists
  ansible.builtin.file:
    path: /etc/kubernetes/pki/etcd
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not k8s_external_etcd_certs_stat.stat.exists

- name: Copy the external etcd CA cert and the apiserver-etcd-client cert/key onto this host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../artifacts/k8s_etcd_ca/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { src: ca.crt, dest: /etc/kubernetes/pki/etcd/ca.crt }
    - { src: apiserver-etcd-client.crt, dest: /etc/kubernetes/pki/apiserver-etcd-client.crt }
    - { src: apiserver-etcd-client.key, dest: /etc/kubernetes/pki/apiserver-etcd-client.key }
  loop_control:
    label: "{{ item.dest }}"
  when: not k8s_external_etcd_certs_stat.stat.exists
