---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when:
    - k8s_disable_swap | bool
    - ansible_swaptotal_mb | default(0) > 0
  changed_when: true

- name: Disable swap persistently (comment out swap entries in fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1 # disabled for Kubernetes by server_roles/kubernetes_node'
  when: k8s_disable_swap | bool

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist required kernel modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

# roles/el10_baseline_hardening (RHEL10/AlmaLinux10) and
# ansible-lockdown.RHEL9-CIS (rhel9) both disable IP forwarding fleet-wide
# by default. This re-asserts what Kubernetes needs unconditionally, same
# posture and same caveat as server_roles/docker_host's sysctl.yml — see
# docs/SERVER_ROLES.md and inventories/<env>/group_vars/k8s_nodes.yml for
# the "proper" per-tier override that avoids fighting a later
# hardening.yml re-run on rhel9.
- name: Enable IP forwarding and bridge-netfilter sysctls
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

- name: Ensure the Kubernetes audit log directory exists
  ansible.builtin.file:
    path: /var/log/kubernetes/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: "'k8s_control_plane' in group_names"

- name: Ensure /etc/kubernetes exists
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0700"
