---
- name: Fail loudly if the Django secret key is missing or too short
  ansible.builtin.assert:
    that:
      - netbox_secret_key | length >= 50
    fail_msg: >-
      netbox_secret_key is empty (or shorter than 50 characters — that's
      NetBox/Django's own minimum). Generate one
      (`openssl rand -base64 45` is a reasonable source of entropy, or
      NetBox's own generate_secret_key.py) and supply it via an
      ansible-vault encrypted group_vars/host_vars file — never in
      plaintext, and never generated automatically by this role, since
      rotating it invalidates every active session.

- name: Fail loudly if the superuser password is missing
  ansible.builtin.assert:
    that:
      - netbox_superuser_password | length > 0
    fail_msg: >-
      netbox_superuser_password is empty. Supply it via an ansible-vault
      encrypted group_vars/host_vars file.

- name: Fail loudly if the Redis passwords are missing or identical
  ansible.builtin.assert:
    that:
      - netbox_redis_password | length > 0
      - netbox_redis_cache_password | length > 0
      - netbox_redis_password != netbox_redis_cache_password
    fail_msg: >-
      netbox_redis_password / netbox_redis_cache_password must both be
      set and different from each other (they're two separate Redis
      instances — the task queue and the cache) — supply via an
      ansible-vault encrypted group_vars/host_vars file.

- name: Fail loudly if external database is enabled but its password is missing
  ansible.builtin.assert:
    that:
      - netbox_database_password | length > 0
    fail_msg: >-
      netbox_external_database_enabled is true but
      netbox_database_password is empty. Supply it via an ansible-vault
      encrypted group_vars/host_vars file.
  when: netbox_external_database_enabled | bool

- name: Fail loudly if external database is enabled but no host is configured
  ansible.builtin.assert:
    that:
      - netbox_database_host != 'CHANGEME'
    fail_msg: >-
      netbox_external_database_enabled is true but netbox_database_host
      is still the CHANGEME placeholder — set it to the inventory_hostname
      of a server_roles/postgresql_server host in the dbservers group.
  when: netbox_external_database_enabled | bool

- name: Warn that the bundled postgres container is lab/evaluation only
  ansible.builtin.debug:
    msg: >-
      WARNING: netbox_external_database_enabled is false on
      {{ inventory_hostname }} — using the bundled postgres container.
      Fine for lab/evaluation; a real GxP NetBox instance should point at
      a hardened server_roles/postgresql_server host instead (real
      backup mechanism, pgAudit, TLS) — see docs/APPS.md.
  when: not (netbox_external_database_enabled | bool)
