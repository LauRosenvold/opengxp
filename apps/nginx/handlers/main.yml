---
- name: Restart nginx container
  ansible.builtin.command: >
    docker compose -f {{ nginx_app_dir }}/docker-compose.yml restart nginx
  args:
    chdir: "{{ nginx_app_dir }}"
  changed_when: true
  # nginx.conf and the TLS cert/key are bind-mounted file content, not
  # part of the compose service definition itself — `docker compose up
  # -d` (tasks/compose.yml) has no visibility into that and won't pick up
  # a plain content change on its own, same reasoning as apps/netbox's
  # own nginx restart handler.
