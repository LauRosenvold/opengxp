---
- name: Fail loudly if no registry hostname is configured
  ansible.builtin.assert:
    that:
      - registry_hostname != 'CHANGEME'
    fail_msg: >-
      registry_hostname is still the CHANGEME placeholder. Set it to the
      FQDN clients will actually use to pull/push
      (registry_hostname/myimage) — it also has to match the TLS cert's
      CN/SAN.

- name: Fail loudly if no registry users are configured
  ansible.builtin.assert:
    that:
      - registry_users | length > 0
    fail_msg: >-
      registry_users is empty. This role always requires authentication
      (no anonymous push or pull) — populate it with at least one
      {username, password} pair, password supplied via an ansible-vault
      encrypted group_vars/host_vars file.

- name: Fail loudly if any registry user is missing a password
  ansible.builtin.assert:
    that:
      - item.username | default('') | length > 0
      - item.password | default('') | length > 0
    fail_msg: >-
      Every entry in registry_users needs both a username and a
      password — check the entry rendering as
      {{ item.username | default('(missing username)') }}.
  loop: "{{ registry_users }}"
  loop_control:
    label: "{{ item.username | default('(missing username)') }}"
