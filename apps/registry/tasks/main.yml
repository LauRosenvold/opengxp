---
# Assumes server_roles/docker_host has already run against this host —
# this role only deploys the registry stack on top of an existing,
# hardened Docker installation. See docs/APPS.md.

- name: Fail loudly up front if required config/secrets are missing
  ansible.builtin.include_tasks: secrets.yml
  tags: [prep]

- name: Create bind-mounted data directories
  ansible.builtin.include_tasks: directories.yml
  tags: [prep]

- name: Configure TLS
  ansible.builtin.include_tasks: tls.yml
  tags: [prep]

- name: Configure htpasswd authentication
  ansible.builtin.include_tasks: auth.yml
  tags: [auth]

- name: Render and deploy the compose stack
  ansible.builtin.include_tasks: compose.yml
  tags: [compose]

- name: Configure garbage collection
  ansible.builtin.include_tasks: gc.yml
  tags: [gc]
