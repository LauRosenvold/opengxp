---
# Pre-production qualification environment. Must mirror production's group
# structure exactly (rhel9/rhel10/almalinux10 x gxp_critical/gxp_standard x
# webservers/appservers/dbservers) even if populated with far fewer hosts —
# playbooks and group_vars keys are shared verbatim with production.

all:
  vars:
    # Must match automation_user_name in group_vars/all.yml — see the note
    # in inventories/production/hosts.yml. Requires
    # playbooks/provision_automation_user.yml to have run once per host.
    ansible_user: svc_ansible
    ansible_become: true

  hosts:
    # See the note in inventories/production/hosts.yml — explicit so
    # group_vars/all.yml (vCenter connection vars) reliably applies.
    localhost:
      ansible_connection: local
      ansible_become: false

  children:
    rhel9:
      hosts: {}
    rhel10:
      hosts: {}
    almalinux10:
      hosts: {}
    gxp_critical:
      hosts: {}
    gxp_standard:
      hosts: {}
    webservers:
      hosts: {}
    appservers:
      hosts: {}
    dbservers:
      hosts: {}
    docker_hosts:
      hosts: {}
    k8s_nodes:
      children:
        k8s_control_plane:
          hosts: {}
        k8s_workers:
          hosts: {}
    netbox_hosts:
      hosts: {}
    registry_hosts:
      hosts: {}
    hyperv_hosts:
      hosts: {}
