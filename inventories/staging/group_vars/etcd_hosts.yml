---
# CANONICAL COPY LIVES IN inventories/production/group_vars/etcd_hosts.yml
# See the note in staging/group_vars/rhel9.yml — same rule applies here.
#
# Runs server_roles/etcd_cluster (see playbooks/etcd_cluster.yml — NOT
# part of playbooks/site.yml). A standalone etcd cluster, no Kubernetes
# involved at all — completely separate from k8s_nodes' own k8s_etcd
# child group (server_roles/kubernetes_node's k8s_external_etcd_enabled
# option). See the note in hosts.yml — don't mix hosts between the two.
#
# Zone-wide open within roles/firewalld_baseline's default-deny zone,
# not source-restricted — same documented gap as dbservers/mssql_hosts
# (see docs/SERVER_ROLES.md).
firewalld_rules:
  - { port: "2379/tcp" }   # etcd client
  - { port: "2380/tcp" }   # etcd peer

# --- Release verification ---------------------------------------------------
# Left at server_roles/etcd_cluster's own CHANGEME-equivalent (empty)
# default here on purpose — fill in from etcd's own SHA256SUMS file for
# whichever etcd_version you're pinning (see
# server_roles/etcd_cluster/defaults/main.yml):
# etcd_release_sha256: "CHANGEME"

# --- Cluster identity ---------------------------------------------------------
# Fails loudly if left at the CHANGEME placeholder — an arbitrary string
# unique to this specific cluster bootstrap, same value on every host in
# etcd_hosts:
# etcd_cluster_token: "gxp-etcd-cluster-01"   # CHANGEME

# --- TLS -----------------------------------------------------------------------
# Self-signed cluster CA by default (see
# server_roles/etcd_cluster/defaults/main.yml). Point etcd_ssl_ca_src at
# a real CA-issued CA cert once you have one — per-host
# etcd_ssl_cert_src/_key_src then belong in each host's own host_vars,
# not here, since every cert's SAN carries that host's own address:
# etcd_ssl_ca_src: "/path/on/control/node/etcd-cluster-ca.crt"

# --- Authentication ----------------------------------------------------------
# Off by default — mutual TLS already gates network access. Fails
# loudly if enabled without a password:
# etcd_auth_enabled: true
# etcd_root_password: "{{ vault_etcd_root_password }}"
