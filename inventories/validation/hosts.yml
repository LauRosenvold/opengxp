---
# IQ/OQ/PQ execution environment. See docs/VALIDATION.md. Typically a
# small, fixed set of hosts (one per OS/tier combination is often enough)
# kept intentionally stable so validation evidence stays comparable run
# over run — don't churn this inventory casually.

all:
  vars:
    # Must match automation_user_name in group_vars/all.yml — see the note
    # in inventories/production/hosts.yml. Requires
    # playbooks/provision_automation_user.yml to have run once per host.
    ansible_user: svc_ansible
    ansible_become: true

  hosts:
    # See the note in inventories/production/hosts.yml — explicit so
    # group_vars/all.yml (vCenter connection vars) reliably applies.
    localhost:
      ansible_connection: local
      ansible_become: false

  children:
    rhel9:
      hosts: {}
    rhel10:
      hosts: {}
    almalinux10:
      hosts: {}
    almalinux9:
      hosts: {}
    gxp_critical:
      hosts: {}
    gxp_standard:
      hosts: {}
    webservers:
      hosts: {}
    appservers:
      hosts: {}
    dbservers:
      hosts: {}
    mssql_hosts:
      hosts: {}
    etcd_hosts:
      hosts: {}
    docker_hosts:
      hosts: {}
    k8s_nodes:
      children:
        k8s_control_plane:
          hosts: {}
        k8s_workers:
          hosts: {}
        k8s_etcd:
          hosts: {}
    netbox_hosts:
      hosts: {}
    registry_hosts:
      hosts: {}
    nginx_hosts:
      hosts: {}
    hyperv_hosts:
      hosts: {}
    dns_servers:
      hosts: {}
    ca_servers:
      hosts: {}
