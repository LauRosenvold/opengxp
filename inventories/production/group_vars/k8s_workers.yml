---
# Same zone-wide-open caveat as group_vars/k8s_control_plane.yml.
firewalld_rules:
  - { port: "10250/tcp" }        # kubelet API
  - { port: "30000-32767/tcp" }  # NodePort service range — only needed if workloads actually use NodePort
  # --- CNI/add-on ports, only relevant depending on choices in
  # group_vars/k8s_nodes.yml — remove whichever don't apply to you:
  - { port: "8472/udp" }        # Flannel VXLAN backend (k8s_cni_provider: flannel) — remove if using Calico
  - { port: "7946/tcp" }        # MetalLB memberlist (k8s_metallb_enabled: true) — remove if MetalLB is off
  - { port: "7946/udp" }        # MetalLB memberlist
