---
# Production estate inventory. Populate the empty groups below with real
# hostnames (or, better, point `ansible.builtin.script`/a dynamic inventory
# plugin at Satellite/CMDB instead of hand-maintaining this file for a large
# fleet — see the note at the bottom).
#
# Every host must land in exactly one OS group (rhel9 / rhel10 /
# almalinux10) and exactly one GxP tier group (gxp_critical /
# gxp_standard). Functional groups (webservers/appservers/dbservers) drive
# roles/firewalld_baseline's per-service port list — add new functional
# groups there and in roles/firewalld_baseline/defaults/main.yml together.
#
# almalinux10 shares the same el10_baseline_hardening CIS fallback as
# rhel10 (see inventories/production/group_vars/almalinux10.yml) — it is
# NOT folded into the rhel10 group itself, so an inventory listing always
# tells you the real OS/support vendor at a glance without having to cross
# -reference ansible_distribution.

all:
  vars:
    # Must match automation_user_name in group_vars/all.yml. This account
    # doesn't exist on a host until playbooks/provision_automation_user.yml
    # has run against it once — see roles/automation_user. No playbook in
    # this repo ever connects as root.
    ansible_user: svc_ansible
    ansible_become: true

  hosts:
    # Explicit (not Ansible's ad-hoc "implicit localhost") specifically so
    # group_vars/all.yml reliably applies to it — playbooks/
    # provision_vm_vcenter.yml (see docs/PROVISIONING.md) runs against
    # this, and vCenter connection vars live in group_vars/all.yml like
    # everything else environment-specific.
    localhost:
      ansible_connection: local
      ansible_become: false

  children:
    rhel9:
      hosts: {}
        # app01.gxp.example.internal:
        # db01.gxp.example.internal:

    rhel10:
      hosts: {}
        # app02.gxp.example.internal:

    almalinux10:
      hosts: {}
        # app03.gxp.example.internal:

    gxp_critical:
      # Systems in scope for GMP/GLP/GCP record integrity: MES, LIMS,
      # historian, e-signature-bearing app servers, their DB backends.
      # Stricter session timeout, audit set, and patch window apply
      # (see inventories/production/group_vars/gxp_critical.yml).
      hosts: {}
        # db01.gxp.example.internal:

    gxp_standard:
      # Everything else in the regulated estate that isn't itself a
      # source of GxP records (jump hosts, internal tooling, CI runners).
      hosts: {}
        # app01.gxp.example.internal:
        # app02.gxp.example.internal:

    webservers:
      hosts: {}
    appservers:
      hosts: {}
        # app01.gxp.example.internal:
        # app02.gxp.example.internal:
    dbservers:
      hosts: {}
        # db01.gxp.example.internal:

    docker_hosts:
      # Cross-cutting, like the functional groups above: a host is also in
      # rhel9/rhel10/almalinux10 and gxp_critical/gxp_standard. Runs
      # server_roles/docker_host (see playbooks/docker_host.yml) — NOT
      # part of playbooks/site.yml. See docs/SERVER_ROLES.md.
      hosts: {}
        # app04.gxp.example.internal:

    k8s_nodes:
      # Parent group for shared vars (inventories/production/group_vars/
      # k8s_nodes.yml) — control-plane/worker-specific vars go in the
      # respective child group_vars file instead. Runs
      # server_roles/kubernetes_node (see playbooks/kubernetes_cluster.yml)
      # — NOT part of playbooks/site.yml. See docs/SERVER_ROLES.md.
      children:
        k8s_control_plane:
          # First host listed is the one that runs `kubeadm init` — order
          # matters here in a way it doesn't for any other group in this
          # file. A single host is a valid (non-HA) control plane; more
          # than one requires k8s_control_plane_endpoint to be set (see
          # group_vars/k8s_control_plane.yml).
          hosts: {}
            # k8s-cp01.gxp.example.internal:
        k8s_workers:
          hosts: {}
            # k8s-worker01.gxp.example.internal:
            # k8s-worker02.gxp.example.internal:

    netbox_hosts:
      # An application layer (apps/netbox, see playbooks/netbox.yml),
      # deployed ON TOP of a Docker host, not an alternative to it — every
      # host here should ALSO be in docker_hosts above (playbooks/
      # docker_host.yml must have already run against it). NOT part of
      # playbooks/site.yml. See docs/APPS.md.
      hosts: {}
        # app04.gxp.example.internal:

    registry_hosts:
      # Another application layer (apps/registry, see
      # playbooks/registry.yml) — same rule as netbox_hosts: every host
      # here should ALSO be in docker_hosts. Once running, point other
      # roles' registry-mirror/image-source CHANGEME vars at this host
      # instead of docker.io directly — see docs/APPS.md.
      hosts: {}
        # app05.gxp.example.internal:

    hyperv_hosts:
      # Fundamentally different from every other group above: these are
      # Windows Hyper-V hosts, connected via WinRM, not a RHEL/AlmaLinux
      # target this repo's roles/ baseline applies to at all — see
      # docs/PROVISIONING.md. Not part of any rhel9/rhel10/almalinux10 or
      # gxp_critical/gxp_standard group, and every "hosts: all" playbook
      # in playbooks/ explicitly excludes this group
      # (`hosts: all:!hyperv_hosts`) for exactly that reason.
      # group_vars/hyperv_hosts.yml overrides the `all:vars:` block above
      # (ansible_user/ansible_become) with WinRM-appropriate connection
      # vars — that override is what makes the exclusion enforceable in
      # the first place, not just a documentation comment.
      hosts: {}
        # hyperv01.gxp.example.internal:

# For a "large enterprise" fleet, prefer a dynamic inventory instead of this
# static file once you're past a few dozen hosts:
#   - redhat.satellite.foreman inventory plugin, if Satellite is the source
#     of truth for host records (recommended, since you're already using it
#     for content/patching) — see:
#     https://console.redhat.com/ansible/automation-hub -> redhat.satellite
#   - or a CMDB-backed script plugin.
# Keep the group *names* (rhel9/rhel10/almalinux10/gxp_critical/
# gxp_standard/webservers/appservers/dbservers/docker_hosts/k8s_nodes/
# k8s_control_plane/k8s_workers/netbox_hosts/registry_hosts/hyperv_hosts)
# identical either way, since every group_vars file in this directory is
# keyed on them. If you move to a dynamic inventory, double check it
# preserves k8s_control_plane host ORDER too — server_roles/kubernetes_node
# relies on `groups['k8s_control_plane'] | first` being stable across runs.
