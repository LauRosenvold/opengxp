---
# Production estate inventory. Populate the empty groups below with real
# hostnames (or, better, point `ansible.builtin.script`/a dynamic inventory
# plugin at Satellite/CMDB instead of hand-maintaining this file for a large
# fleet — see the note at the bottom).
#
# Every host must land in exactly one OS group (rhel9 / rhel10 /
# almalinux9 / almalinux10) and exactly one GxP tier group (gxp_critical /
# gxp_standard). Functional groups (webservers/appservers/dbservers) drive
# roles/firewalld_baseline's per-service port list — add new functional
# groups there and in roles/firewalld_baseline/defaults/main.yml together.
#
# almalinux9 uses the same ansible-lockdown.RHEL9-CIS engine as rhel9 (see
# inventories/production/group_vars/almalinux9.yml); almalinux10 shares
# the same el10_baseline_hardening CIS fallback as rhel10 (see
# inventories/production/group_vars/almalinux10.yml). Neither is folded
# into its rhel counterpart group, so an inventory listing always tells
# you the real OS/support vendor at a glance without having to cross
# -reference ansible_distribution.

all:
  vars:
    # Must match automation_user_name in group_vars/all.yml. This account
    # doesn't exist on a host until playbooks/provision_automation_user.yml
    # has run against it once — see roles/automation_user. No playbook in
    # this repo ever connects as root.
    ansible_user: svc_ansible
    ansible_become: true

  hosts:
    # Explicit (not Ansible's ad-hoc "implicit localhost") specifically so
    # group_vars/all.yml reliably applies to it — playbooks/
    # provision_vm_vcenter.yml (see docs/PROVISIONING.md) runs against
    # this, and vCenter connection vars live in group_vars/all.yml like
    # everything else environment-specific.
    localhost:
      ansible_connection: local
      ansible_become: false

  children:
    rhel9:
      hosts: {}
        # app01.gxp.example.internal:
        # db01.gxp.example.internal:

    rhel10:
      hosts: {}
        # app02.gxp.example.internal:

    almalinux10:
      hosts: {}
        # app03.gxp.example.internal:

    almalinux9:
      hosts: {}
        # app06.gxp.example.internal:

    gxp_critical:
      # Systems in scope for GMP/GLP/GCP record integrity: MES, LIMS,
      # historian, e-signature-bearing app servers, their DB backends.
      # Stricter session timeout, audit set, and patch window apply
      # (see inventories/production/group_vars/gxp_critical.yml).
      hosts: {}
        # db01.gxp.example.internal:

    gxp_standard:
      # Everything else in the regulated estate that isn't itself a
      # source of GxP records (jump hosts, internal tooling, CI runners).
      hosts: {}
        # app01.gxp.example.internal:
        # app02.gxp.example.internal:

    webservers:
      hosts: {}
    appservers:
      hosts: {}
        # app01.gxp.example.internal:
        # app02.gxp.example.internal:
    dbservers:
      hosts: {}
        # db01.gxp.example.internal:

    mssql_hosts:
      # A separate database-engine group from dbservers — runs
      # server_roles/mssql_server (see playbooks/mssql_server.yml), not
      # postgresql_server. See the note in
      # group_vars/dbservers.yml. NOT part of playbooks/site.yml.
      hosts: {}
        # db02.gxp.example.internal:

    etcd_hosts:
      # A standalone etcd cluster (server_roles/etcd_cluster, see
      # playbooks/etcd_cluster.yml) — plain upstream etcd, no Kubernetes
      # tooling. Completely separate from k8s_nodes' own k8s_etcd child
      # group below (server_roles/kubernetes_node's
      # k8s_external_etcd_enabled option, which bootstraps etcd via
      # kubeadm specifically for a Kubernetes control plane) — don't mix
      # hosts between the two groups. NOT part of playbooks/site.yml.
      # First host listed matters, same reason as k8s_etcd below — it's
      # where the cluster CA gets generated before being distributed.
      hosts: {}
        # etcd01.gxp.example.internal:
        # etcd02.gxp.example.internal:
        # etcd03.gxp.example.internal:

    kurrentdb_hosts:
      # A KurrentDB cluster (server_roles/kurrentdb_cluster, see
      # playbooks/kurrentdb_cluster.yml) — KurrentDB is the current name
      # of what used to ship as "EventStoreDB" (see
      # server_roles/kurrentdb_cluster/defaults/main.yml for the rebrand
      # note). NOT part of playbooks/site.yml. First host listed matters,
      # same reason as etcd_hosts above (unless kurrentdb_ssl_ca_src is
      # set to a real CA) — it's where the self-signed cluster CA gets
      # generated before being distributed.
      hosts: {}
        # kurrentdb01.gxp.example.internal:
        # kurrentdb02.gxp.example.internal:
        # kurrentdb03.gxp.example.internal:

    file_share_hosts:
      # A temporary SMB/NFS file share server (server_roles/file_share_server,
      # see playbooks/file_share_server.yml) — transient working storage,
      # not a GxP record repository (see group_vars/file_share_hosts.yml
      # and docs/SERVER_ROLES.md). NOT part of playbooks/site.yml.
      hosts: {}
        # fileshare01.gxp.example.internal:

    docker_hosts:
      # Cross-cutting, like the functional groups above: a host is also in
      # rhel9/rhel10/almalinux9/almalinux10 and gxp_critical/gxp_standard. Runs
      # server_roles/docker_host (see playbooks/docker_host.yml) — NOT
      # part of playbooks/site.yml. See docs/SERVER_ROLES.md.
      hosts: {}
        # app04.gxp.example.internal:

    kvm_hosts:
      # Cross-cutting, like docker_hosts above: a host is also in
      # rhel9/rhel10/almalinux9/almalinux10 and gxp_critical/gxp_standard.
      # A KVM/libvirt hypervisor host that provisioning/vm_provision's
      # KVM path (playbooks/provision_vm_kvm.yml) connects to over normal
      # SSH to create/remove OTHER hosts' VMs — see docs/PROVISIONING.md.
      # Unlike hyperv_hosts/dns_servers/ca_servers below, this is a real
      # RHEL/AlmaLinux host this repo's own baseline applies to just
      # fine, so it's deliberately NOT added to any `hosts: all:!...`
      # exclusion list — it gets CIS-hardened/audited like every other
      # fleet member via playbooks/site.yml. If you'd rather treat your
      # KVM layer as out-of-scope infrastructure the way vCenter/Proxmox/
      # Hyper-V are, exclude it yourself; this repo doesn't make that
      # call for you.
      hosts: {}
        # kvm01.gxp.example.internal:

    k8s_nodes:
      # Parent group for shared vars (inventories/production/group_vars/
      # k8s_nodes.yml) — control-plane/worker-specific vars go in the
      # respective child group_vars file instead. Runs
      # server_roles/kubernetes_node (see playbooks/kubernetes_cluster.yml)
      # — NOT part of playbooks/site.yml. See docs/SERVER_ROLES.md.
      children:
        k8s_control_plane:
          # First host listed is the one that runs `kubeadm init` — order
          # matters here in a way it doesn't for any other group in this
          # file. A single host is a valid (non-HA) control plane; more
          # than one requires k8s_control_plane_endpoint to be set (see
          # group_vars/k8s_control_plane.yml).
          hosts: {}
            # k8s-cp01.gxp.example.internal:
        k8s_workers:
          hosts: {}
            # k8s-worker01.gxp.example.internal:
            # k8s-worker02.gxp.example.internal:
        k8s_etcd:
          # Empty (and irrelevant) unless k8s_external_etcd_enabled is
          # also set true in group_vars/k8s_nodes.yml — kubeadm's
          # default "stacked" etcd (co-located on k8s_control_plane
          # nodes) needs nothing here at all. See docs/SERVER_ROLES.md.
          # First host listed matters the same way it does for
          # k8s_control_plane — it's the one the etcd CA gets generated
          # on before being distributed to the rest.
          hosts: {}
            # k8s-etcd01.gxp.example.internal:
            # k8s-etcd02.gxp.example.internal:
            # k8s-etcd03.gxp.example.internal:

    netbox_hosts:
      # An application layer (apps/netbox, see playbooks/netbox.yml),
      # deployed ON TOP of a Docker host, not an alternative to it — every
      # host here should ALSO be in docker_hosts above (playbooks/
      # docker_host.yml must have already run against it). NOT part of
      # playbooks/site.yml. See docs/APPS.md.
      hosts: {}
        # app04.gxp.example.internal:

    registry_hosts:
      # Another application layer (apps/registry, see
      # playbooks/registry.yml) — same rule as netbox_hosts: every host
      # here should ALSO be in docker_hosts. Once running, point other
      # roles' registry-mirror/image-source CHANGEME vars at this host
      # instead of docker.io directly — see docs/APPS.md.
      hosts: {}
        # app05.gxp.example.internal:

    nginx_hosts:
      # A third application layer (apps/nginx, see playbooks/nginx.yml)
      # — same rule as netbox_hosts/registry_hosts: every host here
      # should ALSO be in docker_hosts. Standalone reverse-proxy/static
      # content nginx, distinct from netbox's own bundled proxy and
      # registry's native TLS — see docs/APPS.md.
      hosts: {}
        # app07.gxp.example.internal:

    hyperv_hosts:
      # Fundamentally different from every other group above: these are
      # Windows Hyper-V hosts, connected via WinRM, not a RHEL/AlmaLinux
      # target this repo's roles/ baseline applies to at all — see
      # docs/PROVISIONING.md. Not part of any rhel9/rhel10/almalinux9/
      # almalinux10 or gxp_critical/gxp_standard group, and every
      # "hosts: all" playbook in playbooks/ explicitly excludes this
      # group (along with dns_servers and ca_servers below —
      # `hosts: all:!hyperv_hosts:!dns_servers:!ca_servers`) for exactly
      # that reason.
      # group_vars/hyperv_hosts.yml overrides the `all:vars:` block above
      # (ansible_user/ansible_become) with WinRM-appropriate connection
      # vars — that override is what makes the exclusion enforceable in
      # the first place, not just a documentation comment.
      hosts: {}
        # hyperv01.gxp.example.internal:

    dns_servers:
      # Windows DNS Server(s) (AD-integrated or standalone) that
      # provisioning/dns_registration connects to over WinRM to
      # create/remove records — see docs/PKI_DNS.md. Same "not a
      # RHEL/AlmaLinux target, excluded from every hosts: all playbook"
      # posture as hyperv_hosts above.
      hosts: {}
        # dns01.gxp.example.internal:

    ca_servers:
      # Windows CA(s) (Active Directory Certificate Services) that
      # provisioning/certificate_enrollment connects to over WinRM to
      # request/revoke certificates via certreq/certutil — see
      # docs/PKI_DNS.md. Same posture as dns_servers above.
      hosts: {}
        # ca01.gxp.example.internal:

# For a "large enterprise" fleet, prefer a dynamic inventory instead of this
# static file once you're past a few dozen hosts:
#   - redhat.satellite.foreman inventory plugin, if Satellite is the source
#     of truth for host records (recommended, since you're already using it
#     for content/patching) — see:
#     https://console.redhat.com/ansible/automation-hub -> redhat.satellite
#   - or a CMDB-backed script plugin.
# Keep the group *names* (rhel9/rhel10/almalinux9/almalinux10/gxp_critical/
# gxp_standard/webservers/appservers/dbservers/mssql_hosts/etcd_hosts/
# kurrentdb_hosts/file_share_hosts/docker_hosts/kvm_hosts/k8s_nodes/
# k8s_control_plane/k8s_workers/k8s_etcd/netbox_hosts/registry_hosts/
# nginx_hosts/hyperv_hosts/dns_servers/ca_servers) identical either way,
# since every group_vars file in this directory is keyed on them. If you
# move to a dynamic inventory, double check it preserves
# k8s_control_plane, k8s_etcd, etcd_hosts, AND kurrentdb_hosts host ORDER
# too (unless kurrentdb_ssl_ca_src is set to a real CA on every host) —
# server_roles/kubernetes_node relies on `groups['k8s_control_plane'] |
# first` and (when k8s_external_etcd_enabled) `groups['k8s_etcd'] |
# first` being stable across runs, server_roles/etcd_cluster relies on
# `groups['etcd_hosts'] | first` the same way, and
# server_roles/kurrentdb_cluster relies on `groups['kurrentdb_hosts'] |
# first` the same way again for its own self-signed cluster CA.
